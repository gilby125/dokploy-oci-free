services:
  postgres:
    image: agentplane-postgres:17
    build: .
    restart: unless-stopped
    # Cap so a PG spike can't starve the neighbors on this shared box
    # (ads-node, shared-redis, komodo periphery). 3g RAM + 1g swap spillover.
    mem_limit: 3g
    memswap_limit: 4g
    # 64MB default shm starves parallel/large ops; give the DB real room.
    shm_size: 256mb
    env_file: [db.env]
    # Tuned for a 1-OCPU / ~3g-capped ARM box on network SSD running a
    # crawl-rebuild + resolver-aggregate workload. Stock defaults (work_mem 4MB,
    # parallelism on a single core, spinning-disk cost model, 4GB cache estimate
    # above the 3g cap) made the nightly crawl saturate the DB and starve web
    # startup (502s) and time out migrations. Mirrored live in postgresql.auto.conf.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=128MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - archive_mode=off
      - -c
      - archive_command=pgbackrest --stanza=agentplane archive-push %p
    ports:
      - "10.0.0.244:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentplane -d agentplane"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
